name: Publish Utto Alarm APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          mkdir -p "$SDK_DIR/licenses"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || [ -d "$SDK_DIR/licenses" ]

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Signing Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "store_password=$SECRET_STORE_PASS" >> $GITHUB_OUTPUT
            echo "key_password=$SECRET_KEY_PASS" >> $GITHUB_OUTPUT
          else
            DEFAULT_PASS="uttoalarm123"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$DEFAULT_PASS" -keypass "$DEFAULT_PASS" \
              -dname "CN=Utto Alarm, OU=Mobile, O=Romio, L=Nadia, ST=West Bengal, C=IN"
            echo "store_password=$DEFAULT_PASS" >> $GITHUB_OUTPUT
            echo "key_password=$DEFAULT_PASS" >> $GITHUB_OUTPUT
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: gradle :app:assembleRelease

      - name: Prepare APK Filename
        run: |
          cp app/build/outputs/apk/release/app-release.apk Utto-Alarm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Utto-Alarm-APK
          path: Utto-Alarm.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
          name: Utto Alarm ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
          generate_release_notes: true
          files: Utto-Alarm.apk
